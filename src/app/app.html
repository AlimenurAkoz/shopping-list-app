<div class="page">
  <h1>Alışveriş Listem</h1>
  <label for="objectName">Eksik ne var?</label>
  <form>
    <div class="inputText">
      <input type="text" id="objectName" [(ngModel)]="objectName" name="objectName" placeholder="Ürün adını giriniz" />
      @if (objectName){
      <button type="button" class="clear" name="clear" (click)="clean()">x</button>
      }
    </div>
    <button class="addBtn" type="submit" name="addbtn">Ekle</button>
  </form>
</div>
